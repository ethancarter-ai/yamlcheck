[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yamlcheck"
version = "0.1.0"
description = "Validate YAML files for type, structure, and schema constraints"
requires-python = ">=3.11"
license = { text = "MIT" }
readme = "README.md"
keywords = ["yaml", "validation", "schema", "cli", "config", "pyyaml", "quality-gate"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["PyYAML>=6.0"]
authors = [
  { name = "Ethan Carter", email = "291844740+ethancarter-ai@users.noreply.github.com" },
]

[project.scripts]
yamlcheck = "yamlcheck:main"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6"]

[tool.setuptools]
py-modules = ["yamlcheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[project.urls]
Repository = "https://github.com/ethancarter-ai/yamlcheck"
